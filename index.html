<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda · Meninas de Sinhá</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF6FB;--card:#fff;--ink:#1A1520;--muted:#6B6272;--line:#E8DEE8;--pink:#FF41FF;--accent:#A21CAF;--accent-d:#86168F;--alert:#C8372D;
--sans:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Playfair Display",Georgia,serif;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;background:#fff;border-bottom:4px solid var(--pink)}
.brand{display:flex;align-items:center;gap:16px}
.brand img{height:56px;width:auto;display:block}
.brand span{font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-left:2px solid var(--line);padding-left:16px}
header button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:600}
header button:hover{border-color:var(--accent);color:var(--accent)}
#login{display:none;max-width:440px;margin:9vh auto;padding:32px 28px;background:var(--card);border:1px solid var(--line);border-radius:20px;text-align:center;box-shadow:0 12px 40px #a21caf14}
#login img{width:min(300px,80%);height:auto;margin-bottom:14px}
#login h2{font:700 24px/1.2 var(--serif);margin:0 0 8px}
#login p{color:var(--muted);margin:0 0 20px}
#login button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 28px;font-weight:700}
#login button:hover{background:var(--accent-d)}
#app{display:none;grid-template-columns:250px 1fr;gap:24px;max-width:1140px;margin:0 auto;padding:24px}
aside{align-self:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 12px #1a15200a}
aside h3{margin:0 0 8px;font:700 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
aside label{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.crow{display:flex;align-items:center;justify-content:space-between;gap:4px}
.crow label{flex:1;min-width:0}.nm{overflow-wrap:anywhere}
.mini{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 8px;line-height:24px}
.mini:hover{border-color:var(--accent);color:var(--accent)}
#new{margin-top:14px;width:100%;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:9px;font-weight:700}
#new:hover{background:var(--accent-d)}
#mk{margin-top:8px;width:100%;background:transparent;border:1px dashed var(--line);border-radius:999px;padding:7px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.bar h2{flex:1 1 260px;margin:0;font:700 26px/1.2 var(--serif);text-transform:capitalize}
.bar button,.bar input{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.bar button:hover{border-color:var(--accent);color:var(--accent)}
.bar .pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.bar .pri:hover{background:var(--accent-d);color:#fff}
.allday{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:0;border-left:4px solid;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;background:var(--card);text-align:left;box-shadow:0 0 0 1px var(--line)}
#grid{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px #1a15200a}
.row{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.row span{position:absolute;left:10px;top:-10px;background:var(--card);padding:0 4px;font-size:12px;color:var(--muted)}
.lane{position:absolute;left:62px;right:10px;top:0;bottom:0}
.ev{position:absolute;border:0;border-left:4px solid;border-radius:8px;padding:3px 8px;font-size:13px;line-height:1.3;text-align:left;overflow:hidden;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.ev b{display:block;font-weight:700}
.ev small{color:var(--muted)}
.ev.conf::after{content:"conflito";position:absolute;right:6px;top:3px;font-size:11px;color:var(--alert);font-weight:700}
.now{position:absolute;left:54px;right:0;height:2px;background:var(--pink)}
.empty{padding:32px;text-align:center;color:var(--muted)}
#msg{color:var(--alert);margin:0 0 10px;min-height:1em}
dialog{border:0;border-radius:18px;padding:0;max-width:560px;max-height:92vh;width:92vw;box-shadow:0 16px 50px #1a152040}
dialog::backdrop{background:#1A152066}
.dlg{padding:22px;border-top:6px solid var(--pink)}
.dlg h3{margin:0 0 4px;font:700 21px/1.25 var(--serif)}
.dlg h4{margin:16px 0 6px;font:700 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dlg dl{margin:12px 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.dlg dt{color:var(--muted)}.dlg dd{margin:0;white-space:pre-wrap;word-break:break-word}
.dlg a,.dlg button{border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:600}
.dlg a:hover,.dlg button:hover{border-color:var(--accent);color:var(--accent)}
.dlg .acts{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:14px}
.dlg input,.dlg select,.dlg textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}
.dlg textarea{min-height:90px;resize:vertical}
.dlg input[type=checkbox]{width:auto}
.dlg .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.dlg .primary:hover{background:var(--accent-d);color:#fff}
.dlg .danger{color:var(--alert);border-color:var(--alert)}
.dlg .mini{padding:2px 10px}
.frow{display:flex;gap:8px;margin:8px 0}.frow select{width:auto}
.arow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.arow span{flex:1;word-break:break-all}.arow em{color:var(--muted);font-style:normal;font-size:13px}
.err{color:var(--alert);min-height:1em;margin:6px 0 0}
.muted{color:var(--muted)}
.fl{display:block;margin:8px 0 2px;font-size:13px;font-weight:600;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
.swatches{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0}
.dlg .sw{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.dlg .sw:hover{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.dlg .sw[aria-checked=true]{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.dlg .sw-def{background:linear-gradient(135deg,#fff 45%,#B9AEBD 45% 55%,#fff 55%)}
.swl{font-size:13px;color:var(--muted);margin-left:4px}
.right{display:flex;align-items:center;gap:14px}
#hello{font-weight:700;color:var(--accent)}
#report{display:none;max-width:1140px;margin:0 auto;padding:24px}
body.reporting #report{display:block}
body.reporting>header,body.reporting #app{display:none!important}
.rtool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.rtool button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-weight:600}
.rtool .pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.rhead{display:flex;align-items:center;gap:18px;border-bottom:4px solid var(--pink);padding-bottom:10px;margin-bottom:12px}
.rhead img{height:60px;width:auto}
.rhead h2{margin:0;font:700 22px var(--serif)}.rhead p{margin:2px 0 0;color:var(--muted)}
.rwrap{overflow-x:auto}
.rtab{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
.rtab th{text-align:left;background:#F6E9F6}
.rtab td,.rtab th{border:1px solid var(--line);padding:5px 7px;vertical-align:top}
@media print{@page{size:A4 landscape;margin:10mm}body{background:#fff}.rtool{display:none}#report{padding:0}.rtab{font-size:9.5px}.rwrap{overflow:visible}}
[hidden]{display:none!important}
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tabs .sp{flex:1}
.tabs .tab{border:0;background:transparent;border-bottom:3px solid transparent;padding:8px 14px;font-weight:700;color:var(--muted);margin-bottom:-1px}
.tabs .tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--pink)}
.tabs .act{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;margin-bottom:6px}
.tabs .act:hover{border-color:var(--accent);color:var(--accent)}
.tabs .pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.tabs .pri:hover{background:var(--accent-d);color:#fff}
.chk2{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 12px #1a15200a}
.card.alert{border-color:var(--alert)}.card.wide{grid-column:1/-1}
.card h3{margin:0 0 8px;font:700 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card.alert h3{color:var(--alert)}
.li{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 0}
.li:last-child{border-bottom:0}.li:hover .lt{color:var(--accent)}
.li time{color:var(--muted);font-size:13px;min-width:92px;text-transform:capitalize}
.li .lt{flex:1}
.bd{font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap}
.bd.y{background:#FFF1BF;color:#7A5B00}.bd.r{background:#FDE0DD;color:var(--alert)}.bd.p{background:#FCE4FC;color:var(--accent-d)}
.rtab .mini{margin-right:6px}
@media(max-width:760px){#app{grid-template-columns:1fr;padding:12px}.brand span{display:none}.brand img{height:46px}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand"><img class="logo" alt="Grupo Cultural Meninas de Sinhá"><span>Agenda institucional</span></div>
  <div class="right"><span id="hello"></span><button id="out" hidden>Sair</button></div>
</header>

<section id="login">
  <img class="logo" alt="Grupo Cultural Meninas de Sinhá">
  <h2>Entre para ver a agenda</h2>
  <p id="lmsg">Use a conta Google que recebeu acesso às agendas da instituição.</p>
  <button id="in">Entrar com Google</button>
</section>

<main id="app">
  <aside>
    <h3>Agendas</h3>
    <div id="cals"></div>
    <button id="new">+ Nova agenda</button>
    <button id="mk" hidden>Criar agendas do sistema</button>
  </aside>
  <section>
    <div class="tabs" role="tablist">
      <button class="tab" id="t_home" role="tab" aria-selected="true">Início</button>
      <button class="tab" id="t_day" role="tab" aria-selected="false">Agenda do dia</button>
      <button class="tab" id="t_hist" role="tab" aria-selected="false">Histórico</button>
      <span class="sp"></span>
      <button id="nev" class="act pri">+ Novo evento</button>
      <button id="bulk" class="act">Criar em massa</button>
      <button id="rep" class="act">Relatório</button>
    </div>
    <p id="msg" role="alert"></p>
    <div id="homeView"></div>
    <div id="histView" hidden></div>
    <div id="dayView" hidden>
    <div class="bar">
      <h2 id="title"></h2>
      <button id="prev" aria-label="Dia anterior">‹</button>
      <button id="today">Hoje</button>
      <button id="next" aria-label="Próximo dia">›</button>
      <input id="pick" type="date" aria-label="Ir para a data">
      <label class="chk2"><input type="checkbox" id="showClosed"> Mostrar concluídos</label>
    </div>
    <div class="allday" id="allday"></div>
    <div id="grid"></div>
    </div>
  </section>
</main>

<section id="report"></section>
<dialog id="dlg"></dialog>

function startOf(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function el(tag, props = {}, kids = []){
  const n = Object.assign(document.createElement(tag), props);
  [].concat(kids).forEach(k => n.append(k));
  return n;
}
const hhmm = d => d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});

/* ===== Login ===== */
function initAuth(){
  tc = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE,
    callback: async r => {
      if (r.error){ showLogin('Não foi possível entrar (' + r.error + '). Tente de novo.'); return; }
      token = r.access_token; await start();
    }
  });
}
function showLogin(m){
  $('#app').style.display = 'none'; $('#out').hidden = true; $('#hello').textContent = '';
  $('#login').style.display = 'block';
  if (m) $('#lmsg').textContent = m;
}
$('#in').onclick = () => tc && tc.requestAccessToken();
$('#out').onclick = () => {
  if (token) google.accounts.oauth2.revoke(token);
  token = null; showLogin('Você saiu. Entre novamente quando quiser.');
};

async function api(path, opt = {}){
  const r = await fetch(API + path, {...opt, headers:{Authorization:'Bearer ' + token, 'Content-Type':'application/json'}});
  if (r.status === 401){ token = null; showLogin('Sua sessão expirou. Entre novamente.'); throw new Error('401'); }
  if (!r.ok){ const j = await r.json().catch(() => ({})); const e0 = j.error?.errors?.[0]; throw new Error((j.error?.message || r.status) + (e0?.location ? ' [campo: ' + e0.location + ']' : '') + (e0?.reason ? ' (' + e0.reason + ')' : '')); }
  return r.status === 204 ? null : r.json();
}

/* ===== Agendas ===== */
async function loadCals(){
  const d = await api('/users/me/calendarList?minAccessRole=reader');
  cals = d.items;
  let hidden = [];
  try { hidden = JSON.parse(localStorage.getItem('ms_hidden')) || []; } catch(e){}
  sel = new Set(cals.filter(c => !hidden.includes(c.id)).map(c => c.id));
  const box = $('#cals'); box.textContent = '';
  cals.forEach(c => {
    const cb = el('input', {type:'checkbox', checked: sel.has(c.id)});
    cb.onchange = () => {
      cb.checked ? sel.add(c.id) : sel.delete(c.id);
      try { localStorage.setItem('ms_hidden', JSON.stringify(cals.filter(x => !sel.has(x.id)).map(x => x.id))); } catch(e){}
      loadDay();
    };
    const dot = el('span', {className:'dot'}); dot.style.background = c.backgroundColor;
    const nm = el('span', {className:'nm', textContent: c.summaryOverride || c.summary});
    const mg = el('button', {className:'mini', textContent:'⋯', title:'Gerenciar agenda', onclick:() => manageCal(c)});
    mg.setAttribute('aria-label', 'Gerenciar agenda ' + nm.textContent);
    box.append(el('div', {className:'crow'}, [el('label', {}, [cb, dot, nm]), mg]));
  });
  const names = cals.map(c => c.summary);
  $('#mk').hidden = SYSTEM_CALS.every(n => names.includes(n));
}
$('#mk').onclick = async () => {
  if (!confirm('Criar as agendas Projetos, Aniversários, Férias e Atividades extras na sua conta?')) return;
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  try {
    const have = cals.map(c => c.summary);
    for (const n of SYSTEM_CALS.filter(n => !have.includes(n)))
      await api('/calendars', {method:'POST', body:JSON.stringify({summary:n, timeZone:tz})});
    await loadCals(); await loadDay();
  } catch(e){ $('#msg').textContent = 'Não foi possível criar as agendas: ' + e.message; }
};

/* ===== Eventos do dia ===== */
async function loadDay(){
  if (view === 'home') await loadHome(); else if (view === 'hist') await loadHist(); else await loadDayOnly();
}
async function loadDayOnly(){
  $('#msg').textContent = '';
  const a = day, b = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1);
  const q = '?singleEvents=true&orderBy=startTime&timeMin=' + encodeURIComponent(a.toISOString()) + '&timeMax=' + encodeURIComponent(b.toISOString());
  try {
    const lists = await Promise.all(cals.filter(c => sel.has(c.id)).map(async c => {
      const d = await api('/calendars/' + encodeURIComponent(c.id) + '/events' + q);
      return d.items.filter(e => e.status !== 'cancelled').map(e => ({...e, _cal:c}));
    }));
    events = lists.flat().filter(e => $('#showClosed').checked || !isClosed(e));
  } catch(e){ if (e.message !== '401') $('#msg').textContent = 'Erro ao carregar a agenda: ' + e.message; return; }
  render();
}
const colorOf = e => EVT_COLORS[e.colorId] || e._cal.backgroundColor;

function render(){
  $('#title').textContent = day.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  $('#pick').value = day.getFullYear() + '-' + String(day.getMonth()+1).padStart(2,'0') + '-' + String(day.getDate()).padStart(2,'0');

  const ad = $('#allday'); ad.textContent = '';
  events.filter(e => e.start.date).forEach(e => {
    const c = el('button', {className:'chip', textContent:e.summary || '(sem título)'});
    c.style.borderColor = colorOf(e); c.onclick = () => openEvent(e); ad.append(c);
  });

  const t = events.filter(e => e.start.dateTime).map(e => {
    const s = Math.max(0, (new Date(e.start.dateTime) - day) / 60000);
    const f = Math.min(1440, (new Date(e.end.dateTime) - day) / 60000);
    return {e, s, f: Math.max(f, s + 20)};
  }).sort((x, y) => x.s - y.s);

  const g = $('#grid'); g.textContent = '';
  if (!t.length){
    g.append(el('div', {className:'empty', textContent: events.length ? 'Sem horários marcados neste dia.' : 'Nenhum compromisso neste dia. O dia inteiro está livre.'}));
    return;
  }
  const h0 = Math.min(6, Math.floor(t[0].s / 60));
  const h1 = Math.max(22, Math.ceil(Math.max(...t.map(x => x.f)) / 60));
  g.style.height = (h1 - h0) * PX + 'px';
  for (let h = h0; h <= h1; h++){
    const r = el('div', {className:'row'}, el('span', {textContent:String(h).padStart(2,'0') + ':00'}));
    r.style.top = (h - h0) * PX + 'px'; g.append(r);
  }
  const lane = el('div', {className:'lane'}); g.append(lane);

  let cluster = [], cols = [], end = 0;
  const flush = () => { cluster.forEach(x => x.n = cols.length); cluster = []; cols = []; };
  t.forEach(x => {
    if (cluster.length && x.s >= end) flush();
    let c = cols.findIndex(v => v <= x.s);
    if (c < 0){ c = cols.length; cols.push(0); }
    cols[c] = x.f; x.c = c; cluster.push(x); end = Math.max(end, x.f);
  });
  flush();

  t.forEach(x => {
    const b = el('button', {className:'ev' + (t.some(y => y !== x && y.s < x.f && y.f > x.s && sameLoc(x.e, y.e)) ? ' conf' : '')}, [
      el('b', {textContent: x.e.summary || '(sem título)'}),
      el('small', {textContent: hhmm(new Date(x.e.start.dateTime)) + ' – ' + hhmm(new Date(x.e.end.dateTime)) + (x.e.location ? ' · ' + x.e.location : '')})
    ]);
    const col = colorOf(x.e);
    b.style.cssText = 'top:' + ((x.s - h0*60) / 60 * PX) + 'px;height:' + ((x.f - x.s) / 60 * PX - 2) + 'px;left:' + (x.c / x.n * 100) + '%;width:calc(' + (100 / x.n) + '% - 4px);border-color:' + col + ';background:color-mix(in srgb,' + col + ' 16%,#fff)';
    b.onclick = () => openEvent(x.e);
    lane.append(b);
  });

  const now = new Date();
  if (+startOf(now) === +day){
    const m = (now - day) / 60000;
    if (m >= h0*60 && m <= h1*60){ const n = el('div', {className:'now'}); n.style.top = ((m - h0*60) / 60 * PX) + 'px'; g.append(n); }
  }
}

function openEvent(e){
  const canEdit = ['owner', 'writer'].includes(e._cal.accessRole);
  const when = e.start.date ? 'Dia inteiro' : hhmm(new Date(e.start.dateTime)) + ' – ' + hhmm(new Date(e.end.dateTime));
  const rows = [['Quando', when], ['Agenda', e._cal.summary]];
  if (e.creator && !isGroup(e.creator.email)) rows.push(['Criado por', nameOf(e.creator.email, e.creator.displayName)]);
  if (e.location) rows.push(['Local', e.location]);
  const free = (e.description || '').split(MARK)[0].trim(); if (free) rows.push(['Descrição', free]);
  const p = e.extendedProperties?.shared || {};
  Object.keys(LABELS).forEach(k => { if (p[k]) rows.push([LABELS[k], p[k]]); });
  const guests = (e.attendees || []).filter(a => !isGroup(a.email));
  if (guests.length) rows.push(['Convidados', guests.map(a => nameOf(a.email, a.displayName)).join('\n')]);
  const dl = el('dl');
  rows.forEach(([k, v]) => dl.append(el('dt', {textContent:k}), el('dd', {textContent:v})));
  const err = el('p', {className:'err'});
  const kids = [el('h3', {textContent: e.summary || '(sem título)'}), dl];

  if (canEdit){
    const em = el('input', {type:'email', placeholder:'email@gmail.com', 'aria-label':'E-mail de quem convidar'});
    const inv = el('button', {className:'primary', textContent:'Convidar', onclick: async () => {
      const v = em.value.trim();
      if (!/^\S+@\S+\.\S+$/.test(v)){ err.textContent = 'Digite um e-mail válido.'; return; }
      err.textContent = '';
      try {
        const r = await api('/calendars/' + enc(e._cal.id) + '/events/' + enc(e.id) + '?sendUpdates=all', {
          method:'PATCH',
          body: JSON.stringify({attendees: [...(e.attendees || []).map(a => ({email:a.email})), {email:v}]})
        });
        e.attendees = r.attendees; openEvent(e);
      } catch(x){ err.textContent = 'Não foi possível convidar: ' + x.message; }
    }});
    kids.push(el('h4', {textContent:'Convidar pessoas para este evento'}), el('div', {className:'frow'}, [em, inv]));
  }
  kids.push(err);

  const acts = el('div', {className:'acts'}, [
    el('a', {href:e.htmlLink, target:'_blank', rel:'noopener', textContent:'Abrir no Google Agenda'}),
    el('button', {textContent:'Copiar link', title:'O link só abre para quem já tem acesso a esta agenda', onclick:x => copyText(e.htmlLink, x.currentTarget)}),
    el('button', {textContent:'Fechar', onclick:() => $('#dlg').close()})
  ]);
  if (canEdit){
    acts.append(el('button', {textContent:'Editar', onclick:() => eventForm(e)}));
    const closing = !isClosed(e);
    acts.append(el('button', {className: closing ? 'primary' : '', textContent: closing ? 'Concluir projeto' : 'Reabrir projeto', onclick: async () => {
      if (closing && !confirm('Marcar este projeto como concluído? Ele sai da agenda principal e fica guardado no Histórico.')) return;
      try { await setStatus(e, closing ? 'Concluído' : 'Em andamento'); $('#dlg').close(); await loadDay(); }
      catch(x){ err.textContent = 'Não foi possível atualizar: ' + x.message; }
    }}));
    const del = (id, msg) => async () => {
      if (!confirm(msg)) return;
      try {
        await api('/calendars/' + enc(e._cal.id) + '/events/' + enc(id) + '?sendUpdates=all', {method:'DELETE'});
        $('#dlg').close(); await loadDay();
      } catch(x){ err.textContent = 'Não foi possível excluir: ' + x.message; }
    };
    if (e.recurringEventId){
      acts.append(
        el('button', {className:'danger', textContent:'Excluir só este dia', onclick: del(e.id, 'Excluir apenas a ocorrência deste dia?')}),
        el('button', {className:'danger', textContent:'Excluir toda a série', onclick: del(e.recurringEventId, 'Excluir TODAS as ocorrências deste evento? Não dá para desfazer.')})
      );
    } else {
      acts.append(el('button', {className:'danger', textContent:'Excluir', onclick: del(e.id, 'Excluir este evento? Não dá para desfazer.')}));
    }
  }
  kids.push(acts);
  showDlg(colorOf(e), kids);
}

  try {
    const d = await api('/calendars/' + enc(c.id) + '/acl');
    list.textContent = '';
    d.items.filter(r => (r.scope.type === 'user' && !isGroup(r.scope.value)) || r.scope.type === 'default').forEach(r => {

/* ===== Criar eventos ===== */
const COLOR_NAMES = {1:'Lavanda',2:'Sálvia',3:'Uva',4:'Flamingo',5:'Banana',6:'Tangerina',7:'Pavão',8:'Grafite',9:'Mirtilo',10:'Manjericão',11:'Tomate'};
const STATUS = ['Planejado','Em andamento','Concluído','Encerrado'];
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const writable = () => cals.filter(c => ['owner','writer'].includes(c.accessRole));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const nextDay = s => { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + 1)); };
const fld = (label, input) => { input.setAttribute('aria-label', label); return el('div', {}, [el('label', {className:'fl', textContent:label}), input]); };
const g2 = kids => el('div', {className:'g2'}, kids);
const I = (type, p = {}) => el('input', {type, ...p});
function colorSelect(){
  const box = el('div', {className:'swatches', role:'radiogroup'});
  const lbl = el('span', {className:'swl'});
  const names = {'':'Cor da agenda', ...COLOR_NAMES};
  let val = '';
  const paint = () => { box.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.v === val))); lbl.textContent = names[val] || names['']; };
  ['', ...Object.keys(COLOR_NAMES)].forEach(k => {
    const b = el('button', {type:'button', className:'sw' + (k ? '' : ' sw-def'), title:names[k]});
    b.dataset.v = k; b.setAttribute('role', 'radio'); b.setAttribute('aria-label', names[k]);
    if (k) b.style.background = EVT_COLORS[k];
    b.onclick = () => { val = k; paint(); };
    box.append(b);
  });
  box.append(lbl);
  Object.defineProperty(box, 'value', {get:() => val, set:v => { val = String(v || ''); paint(); }});
  paint();
  return box;

function calSelect(){
  const s = el('select', {}, writable().map(c => el('option', {value:c.id, textContent:c.summaryOverride || c.summary})));
  const pj = writable().find(c => c.summary === 'Projetos'); if (pj) s.value = pj.id;
  return s;
}
function noWritable(){
  if (writable().length) return false;
  $('#msg').textContent = 'Você não tem nenhuma agenda com permissão de edição. Crie uma agenda primeiro.';
  return true;
}

const MARK = '── Detalhes do projeto ──';
const brDate = s => s.split('-').reverse().join('/');
function detailsBlock(f){
  const has = ['contratante','contatoNome','contato','responsavel','pessoas','status','prazo'].some(k => f[k]);
  if (!has) return '';
  const L = [['Contratante/terceirizado', f.contratante], ['Pessoa de contato', f.contatoNome], ['Contato', f.contato], ['Responsável interno', f.responsavel], ['Pessoas envolvidas', f.pessoas],
    ['Local', f.loc], ['Status', f.status], ['Prazo final', f.prazo && brDate(f.prazo)]].filter(x => x[1]);
  return MARK + '\n' + L.map(x => x[0] + ': ' + x[1]).join('\n');
}

const REM = [['default','Padrão da agenda'],['off','Desativadas'],['10','10 minutos antes'],['60','1 hora antes'],['1440','1 dia antes'],['10080','1 semana antes']];
const isBday = id => /anivers|birthday/i.test(cals.find(c => c.id === id)?.summary || '');
const normLoc = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const sameLoc = (a, b) => { const x = normLoc(a.location); return !!x && x === normLoc(b.location); };
const remBody = v => v === 'default' ? {useDefault:true} : v === 'off' ? {useDefault:false, overrides:[]} : {useDefault:false, overrides:[{method:'popup', minutes:+v}]};

function buildBody(f, patch){
  const o = f.orig || {};
  const nz = (v, had) => v || (patch && had ? null : undefined);
  const shared = {};
  ['contratante','contatoNome','contato','responsavel','pessoas','status','prazo'].forEach(k => { if (f[k]) shared[k] = f[k]; else if (patch && f.origShared && k in f.origShared) shared[k] = null; });
  const body = {summary:f.title, description:nz([f.desc, detailsBlock(f)].filter(Boolean).join('\n\n'), o.description), location:nz(f.loc, o.location), colorId:nz(f.color, o.colorId),
    reminders:remBody(f.rem || 'default'), extendedProperties:{shared}};
  if (!Object.keys(shared).length) delete body.extendedProperties;
  if (f.start){
    body.start = {dateTime:f.date + 'T' + f.start + ':00', timeZone:TZ}; body.end = {dateTime:f.date + 'T' + f.end + ':00', timeZone:TZ};
    if (patch && o.allDay){ body.start.date = null; body.end.date = null; }
  } else {
    body.start = {date:f.date}; body.end = {date:nextDay(f.date)};
    if (patch && o.allDay === false){ body.start.dateTime = null; body.end.dateTime = null; }
  }
  if (f.repeat === 'YEARLY') body.recurrence = ['RRULE:FREQ=YEARLY'];
  else if (f.repeat && f.count > 1) body.recurrence = ['RRULE:FREQ=' + f.repeat + ';COUNT=' + f.count];
  if (f.guests && (f.guests.length || f.hadGuests)) body.attendees = [...new Set([...(f.keepAtt || []), ...f.guests])].map(email => ({email}));
  return body;
}

async function createEvent(calId, f){
  const base = '/calendars/' + enc(calId) + '/events';
  await api(base + '?sendUpdates=' + (f.notify ? 'all' : 'none'), {method:'POST', body:JSON.stringify(buildBody(f, false))});
  if (f.prazo && f.makeDeadline){
    await api(base, {method:'POST', body:JSON.stringify({
      summary:'Prazo: ' + f.title, description:['Data limite do projeto "' + f.title + '".', detailsBlock(f)].filter(Boolean).join('\n\n'), colorId:'5',
      start:{date:f.prazo}, end:{date:nextDay(f.prazo)}, extendedProperties:{shared:{tipo:'prazo'}},
      reminders: f.rem === 'off' ? {useDefault:false, overrides:[]} : {useDefault:false, overrides:[{method:'popup', minutes:1440}, {method:'email', minutes:10080}]}
    })});
  }
}
const saveEvent = (ev, f) => api('/calendars/' + enc(ev._cal.id) + '/events/' + enc(ev.id) + '?sendUpdates=' + (f.notify ? 'all' : 'none'), {method:'PATCH', body:JSON.stringify(buildBody(f, true))});

function eventForm(ev){
  if (!ev && noWritable()) return;
  const sh = ev?.extendedProperties?.shared || {};
  const allDay = !!ev?.start.date;
  const hm = s => { const d = new Date(s); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const f = {title:I('text', {maxLength:200, value:ev?.summary || ''}), cal:calSelect(), color:colorSelect(), all:I('checkbox', {checked:allDay}),
    date:I('date'), start:I('time'), end:I('time'), loc:I('text', {value:ev?.location || ''}),
    desc:el('textarea', {value:(ev?.description || '').split(MARK)[0].trim()}),
    contratante:I('text', {value:sh.contratante || ''}), contatoNome:I('text', {value:sh.contatoNome || ''}), contato:I('text', {value:sh.contato || ''}),
    guests:I('text', {placeholder:'maria@gmail.com, joao@gmail.com', value:(ev?.attendees || []).filter(a => !(a.self || a.organizer || isGroup(a.email) || a.resource)).map(a => a.email).join(', ')}),
    notify:I('checkbox', {checked:true}),
    responsavel:I('text', {value:sh.responsavel || ''}), pessoas:I('text', {value:sh.pessoas || ''}),
    status:el('select', {}, [el('option', {value:'', textContent:'Sem status'}), ...STATUS.map(s => el('option', {value:s, textContent:s}))]),
    prazo:I('date', {value:sh.prazo || ''}), mk:I('checkbox', {checked:true}),
    rem:el('select', {}, REM.map(([k, v]) => el('option', {value:k, textContent:v}))),
    repeat:el('select', {}, [['', 'Não repetir'], ['DAILY', 'Todos os dias'], ['WEEKLY', 'Toda semana'], ['YEARLY', 'Todo ano (sem data final)']].map(([k, v]) => el('option', {value:k, textContent:v}))),
    count:I('number', {min:2, max:60, value:3, disabled:true})};
  f.date.value = ev ? (ev.start.date || ymd(new Date(ev.start.dateTime))) : ymd(day);
  if (ev){
    f.cal.value = ev._cal.id; f.cal.disabled = true; f.color.value = ev.colorId || ''; f.status.value = sh.status || '';
    if (!allDay){ f.start.value = hm(ev.start.dateTime); f.end.value = hm(ev.end.dateTime); }
    const r = ev.reminders, m = r?.overrides?.[0] && String(r.overrides[0].minutes);
    f.rem.value = !r || r.useDefault ? 'default' : (!r.overrides?.length ? 'off' : (REM.some(x => x[0] === m) ? m : 'default'));
  }
  f.start.disabled = f.end.disabled = allDay;
  f.all.onchange = () => { f.start.disabled = f.end.disabled = f.all.checked; };
  f.repeat.onchange = () => { f.count.disabled = !f.repeat.value || f.repeat.value === 'YEARLY'; };
  const autoBday = () => { if (!ev && isBday(f.cal.value)){ f.all.checked = true; f.all.onchange(); f.repeat.value = 'YEARLY'; f.repeat.onchange(); } };
  f.cal.onchange = autoBday; autoBday();
  const err = el('p', {className:'err'});
  const ok = el('button', {className:'primary', textContent: ev ? 'Salvar alterações' : 'Criar evento', onclick: async () => {
    const v = {title:f.title.value.trim(), date:f.date.value, desc:f.desc.value.trim(), loc:f.loc.value.trim(), color:f.color.value,
      contratante:f.contratante.value.trim(), contatoNome:f.contatoNome.value.trim(), contato:f.contato.value.trim(), responsavel:f.responsavel.value.trim(), pessoas:f.pessoas.value.trim(),
      status:f.status.value, prazo:f.prazo.value, makeDeadline:f.mk.checked, rem:f.rem.value};
    if (!f.all.checked){ v.start = f.start.value; v.end = f.end.value; }
    v.notify = f.notify.checked;
    const gl = f.guests.value.split(/[,;\s]+/).map(s => s.trim()).filter(Boolean);
    const badMail = gl.find(m => !/^\S+@\S+\.\S+$/.test(m));
    if (badMail){ err.textContent = 'E-mail inválido nos convidados: ' + badMail; return; }
    const att = ev?.attendees || [], mine = a => a.self || a.organizer || isGroup(a.email) || a.resource;
    v.guests = gl; v.hadGuests = att.some(a => !mine(a)); v.keepAtt = att.filter(mine).map(a => a.email);
    v.orig = ev ? {description:!!ev.description, location:!!ev.location, colorId:!!ev.colorId, allDay:!!ev.start.date} : null;
    v.origShared = ev?.extendedProperties?.shared || null;
    if (!v.title || !v.date){ err.textContent = 'Informe o título e a data.'; return; }
    if (!f.all.checked && (!v.start || !v.end || v.end <= v.start)){ err.textContent = 'Informe o início e um fim depois do início, ou marque "Dia inteiro".'; return; }

/* ===== Criar em massa ===== */
function parseTable(txt){
  const l1 = txt.split('\n')[0];
  const sep = txt.includes('\t') ? '\t' : (l1.split(';').length > l1.split(',').length ? ';' : ',');
  const rows = []; let row = [], cur = '', q = false;
  const endRow = () => { row.push(cur); cur = ''; if (row.some(x => x.trim())) rows.push(row); row = []; };
  for (let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if (q){ if (ch === '"'){ if (txt[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep){ row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && txt[i + 1] === '\n') i++; endRow(); }
    else cur += ch;
  }
  endRow();
  return rows.map(r => r.map(x => x.trim()));
}
function okDate(y, m, d){ const t = new Date(y, m - 1, d); return t.getFullYear() === y && t.getMonth() === m - 1 && t.getDate() === d ? y + '-' + pad(m) + '-' + pad(d) : null; }
function parseDate(s){
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (m) return okDate(+m[3], +m[2], +m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? okDate(+m[1], +m[2], +m[3]) : null;
}
function parseTime(s){ const m = s.match(/^(\d{1,2})[:h](\d{2})$/); return m && +m[1] < 24 && +m[2] < 60 ? pad(+m[1]) + ':' + m[2] : null; }

function bulkDialog(){
  if (noWritable()) return;
  const cal = calSelect(), col = colorSelect();
  const ta = el('textarea', {rows:8, placeholder:'Cole aqui as linhas copiadas do Excel ou Planilhas, ou escolha um arquivo .csv.\nColunas: Título; Data; Início; Fim; Local; Descrição; Prazo\nExemplo: Reunião com patrocinador; 12/03/2027; 14:00; 15:30; Sede; Pauta do contrato; 30/03/2027'});
  const file = I('file', {accept:'.csv,.tsv,.txt'});
  file.onchange = async () => { if (file.files[0]) ta.value = await file.files[0].text(); };
  const mk = I('checkbox', {checked:true});
  const yr = I('checkbox', {checked:isBday(cal.value)});
  cal.onchange = () => { yr.checked = isBday(cal.value); };
  const err = el('p', {className:'err'}), out = el('p', {className:'muted'});
  const go = el('button', {className:'primary', textContent:'Criar eventos', onclick: async () => {
    err.textContent = ''; out.textContent = '';
    const rows = parseTable(ta.value);
    if (rows.length && /^t[ií]tulo$/i.test(rows[0][0])) rows.shift();
    if (!rows.length){ err.textContent = 'Cole ou carregue as linhas dos eventos.'; return; }
    const items = [], bad = [];
    rows.forEach((r, i) => {
      const [title, d, s, e, loc, desc, pz] = r;
      const date = parseDate(d || ''), start = s ? parseTime(s) : '', end = e ? parseTime(e) : '', prazo = pz ? parseDate(pz) : '';
      let why = '';
      if (!title) why = 'sem título'; else if (!date) why = 'data inválida';
      else if (s && (!start || !end || end <= start)) why = 'horário inválido'; else if (pz && !prazo) why = 'prazo inválido';
      if (why) bad.push('item ' + (i + 1) + ' (' + (title || 'sem título') + '): ' + why);
      else items.push({title, date, start:start || undefined, end:end || undefined, loc, desc, prazo, color:col.value, makeDeadline:mk.checked, repeat:yr.checked ? 'YEARLY' : undefined});
    });
    if (bad.length){ err.textContent = 'Nada foi criado. Corrija: ' + bad.join('; '); return; }
    go.disabled = true; let n = 0; const fails = [];
    for (const it of items){
      out.textContent = 'Criando ' + (++n) + ' de ' + items.length + '…';
      try { await createEvent(cal.value, it); } catch(x){ if (x.message === '401') return; fails.push(it.title + ' (' + x.message + ')'); }
    }
    await loadDay();
    out.textContent = (items.length - fails.length) + ' evento(s) criado(s).' + (fails.length ? ' Falharam: ' + fails.join('; ') : '');
    go.disabled = false;
  }});
  showDlg(null, [
    el('h3', {textContent:'Criar eventos em massa'}),
    el('p', {className:'muted', textContent:'Uma linha por evento. Sem horário de início, o evento vira dia inteiro. Com prazo preenchido, cria também o evento do dia limite.'}),
    g2([fld('Agenda', cal), fld('Cor', col)]), fld('Arquivo (opcional)', file), fld('Eventos', ta),
    el('label', {className:'chk'}, [mk, 'Criar o evento de prazo nas linhas que têm prazo']),
    el('label', {className:'chk'}, [yr, 'Repetir todo ano (para aniversários e datas comemorativas)']),
    err, out, el('div', {className:'acts'}, [el('button', {textContent:'Fechar', onclick:() => $('#dlg').close()}), go])
  ]);
}

const REP_HEAD = ['Data','Horário','Evento','Agenda','Local','Contratante/terceirizado','Pessoa de contato','Contato','Responsável interno','Pessoas envolvidas','Status','Prazo final','Descrição'];
const startDate = e => e.start.date ? new Date(e.start.date + 'T00:00:00') : new Date(e.start.dateTime);
function rowOf(e){
  const p = e.extendedProperties?.shared || {};
  const s = startDate(e);
  return [s.toLocaleDateString('pt-BR'), e.start.date ? 'Dia inteiro' : hhmm(s) + ' – ' + hhmm(new Date(e.end.dateTime)), e.summary || '(sem título)',
    e._cal.summaryOverride || e._cal.summary, e.location || '', p.contratante || '', p.contatoNome || '', p.contato || '', p.responsavel || '', p.pessoas || '', p.status || '',
    p.prazo ? brDate(p.prazo) : '', (e.description || '').split(MARK)[0].trim()];
}
function downloadCsv(rows, name){
  const csv = '\ufeff' + [REP_HEAD, ...rows].map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const a = el('a', {href:URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})), download:name});
  document.body.append(a); a.click(); a.remove();
}

const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

async function loadHome(){
  const box = $('#homeView'); box.textContent = 'Carregando…'; $('#msg').textContent = '';
  const t0 = startOf(new Date()), today = ymd(t0), lim = addD(t0, 31);
  const mFrom = new Date(t0.getFullYear(), t0.getMonth(), 1), mTo = new Date(t0.getFullYear(), t0.getMonth() + 1, 1);
  const q = '?singleEvents=true&orderBy=startTime&maxResults=2500&timeMin=' + enc(addD(t0, -180).toISOString()) + '&timeMax=' + enc(addD(t0, 61).toISOString());
  let all;
  try {
    all = (await Promise.all(cals.filter(c => sel.has(c.id)).map(async c =>
      (await api('/calendars/' + enc(c.id) + '/events' + q)).items.filter(e => e.status !== 'cancelled').map(e => ({...e, _cal:c}))))).flat();
  } catch(x){ if (x.message !== '401'){ box.textContent = ''; $('#msg').textContent = 'Erro ao carregar o início: ' + x.message; } return; }
  all.sort((a, b) => startDate(a) - startDate(b));
  const sh = e => e.extendedProperties?.shared || {};
  const births = all.filter(e => /anivers|birthday/i.test(e._cal.summary || '') && startDate(e) >= mFrom && startDate(e) < mTo);
  const work = all.filter(e => !isSpecial(e._cal) && !isClosed(e) && sh(e).tipo !== 'prazo');
  const pend = work.filter(e => startDate(e) >= t0 && startDate(e) < lim);
  const over = work.filter(e => sh(e).prazo && sh(e).prazo < today).sort((a, b) => sh(a).prazo.localeCompare(sh(b).prazo));
  const timed = pend.filter(e => e.start.dateTime).map(e => ({e, s:new Date(e.start.dateTime), f:new Date(e.end.dateTime)}));
  const conf = [];
  timed.forEach((x, i) => timed.slice(0, i).forEach(y => { if (y.f > x.s && y.s < x.f && sameLoc(y.e, x.e)) conf.push([y, x]); }));
  const hoje = work.filter(e => ymd(startDate(e)) === today).length;
  const mes = t0.toLocaleDateString('pt-BR', {month:'long'});

  const cards = [];
  cards.push(card('Aniversariantes de ' + mes, births.length
    ? births.map(e => li(e, pad(startDate(e).getDate()) + '/' + pad(startDate(e).getMonth() + 1), title(e), ymd(startDate(e)) === today ? bd('p', 'hoje') : null))
    : [none('Nenhum aniversário neste mês nas agendas marcadas.')]));
  cards.push(card('Conflitos de local e horário', conf.length
    ? conf.slice(0, 10).map(([a, b]) => li(b.e, dShort(b.s) + ' · ' + hhmm(b.s),
        title(a.e) + ' (' + hhmm(a.s) + '–' + hhmm(a.f) + ') × ' + title(b.e) + ' (' + hhmm(b.s) + '–' + hhmm(b.f) + ') · Local: ' + b.e.location, bd('r', 'conflito')))
    : [none('Nenhum conflito de local e horário nos próximos 30 dias. Só contam eventos com o mesmo local preenchido.')], conf.length ? 'alert' : ''));
  if (over.length) cards.push(card('Prazos vencidos', over.map(e => li(e, brDate(sh(e).prazo), title(e), bd('r', 'vencido'))), 'alert'));
  cards.push(card('Eventos pendentes · próximos 30 dias', pend.length
    ? pend.slice(0, 25).map(e => {
        const pz = sh(e).prazo; let b = null;
        if (pz){ const dd = Math.round((new Date(pz + 'T00:00:00') - t0) / 864e5); b = dd < 0 ? bd('r', 'prazo vencido') : dd <= 7 ? bd('y', 'prazo em ' + brDate(pz)) : null; }
        return li(e, dShort(startDate(e)) + (e.start.dateTime ? ' · ' + hhmm(startDate(e)) : ''), title(e) + ' · ' + (e._cal.summaryOverride || e._cal.summary), b);
      }).concat(pend.length > 25 ? [none('Mostrando os 25 primeiros. Use o Relatório para ver todos.')] : [])
    : [none('Nenhum evento pendente nos próximos 30 dias.')], 'wide'));

  box.textContent = '';
  box.append(el('p', {className:'muted', textContent:hoje + ' compromisso(s) hoje · ' + pend.length + ' pendente(s) nos próximos 30 dias · ' + conf.length + ' conflito(s)'}), el('div', {className:'cards'}, cards));
}

function offerMail(emails, subject, body){
  if (!emails.length || !confirm('Avisar por e-mail as ' + emails.length + ' pessoa(s) com acesso a esta agenda? Vai abrir o seu programa de e-mail com a mensagem pronta.')) return;
  const a = el('a', {href:'mailto:?bcc=' + enc(emails.join(',')).replace(/%2C/g, ',') + '&subject=' + enc(subject) + '&body=' + enc(body)});
  document.body.append(a); a.click(); a.remove();
}
async function start(){
  $('#login').style.display = 'none'; $('#app').style.display = 'grid'; $('#out').hidden = false;
  try { await loadMe(); await loadCals(); await loadDay(); }
  catch(e){ if (e.message !== '401') $('#msg').textContent = 'Erro: ' + e.message; }
}
showLogin();
